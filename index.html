<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charity Water Landing Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <nav class="site-nav" aria-label="Main navigation">
            <a class="logo-link" href="index.html" aria-label="charity: water home">
                <img src="img/cw_logo-2.png" alt="charity: water">
            </a>

            <div class="nav-links">
                <a href="#home">Home</a>
                <a href="#about">About us</a>
                <a href="#why-water">Why water?</a>
            </div>

            <div class="nav-actions">
                <a href="#sign-in">Sign in</a>
                <a class="give-button" href="#give">Give</a>
            </div>
        </nav>
    </header>

    <main class="hero-section" id="home">
        <section class="hero-message">
            <h1>Your generosity.<br>Direct impact.<br>Clean water for all.</h1>
            <p>Join us in making safe, clean water possible so communities live healthier, kids spend more time in school instead of walking hours for water, and women have time to start businesses.</p>
            <a class="impact-button" href="#give">Make an impact</a>
        </section>

        <figure class="hero-image">
            <img src="Zimbabwe_2022_CG-9278.jpg" alt="Women standing beside a water truck in Zimbabwe">
            <figcaption>Zimbabwe project, 2022</figcaption>
        </figure>
    </main>
